<!doctype html>
<!-- Thymeleaf 템플릿 엔진을 사용함을 선언합니다. -->
<html lang="ko" xmlns:th="http://www.thymeleaf.org/">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Delete</title>
    <!-- Bootstrap CSS 파일을 링크합니다. -->
    <link th:href="@{/css/bootstrap.min.css}" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
    <h2>Delete Board</h2>

    <!-- 컨트롤러에서 'error'라는 이름의 모델 속성이 전달된 경우에만 이 div를 표시합니다. (예: 비밀번호 불일치) -->
    <div th:if="${error}" class="alert alert-danger" role="alert">
        <!-- 에러 메시지를 출력합니다. -->
        <p th:text="${error}"></p>
    </div>

    <!-- 게시물 삭제를 위한 비밀번호 확인 폼입니다. -->
    <!-- th:action: 폼 제출 시 요청할 URL을 동적으로 생성합니다. {id} 부분은 ${board.id} 값으로 대체됩니다. -->
    <!-- th:method: HTTP POST 메소드를 사용합니다. -->
    <!-- th:object: 폼 데이터를 바인딩할 객체(board)를 지정합니다. -->
    <form th:action="@{/view/delete/{id}(id=${board.id})}" th:method="post" th:object="${board}">
        <div class="form-group">
            <label for="password">Password</label>
            <!-- 삭제를 위해 게시물 비밀번호를 입력받습니다. -->
            <!-- name="password": 서버에서 'password'라는 이름의 파라미터로 이 값을 받게 됩니다. -->
            <input type="password" id="password" name="password" class="form-control" required>
        </div>
        <button type="submit" class="btn btn-danger mt-3">삭제</button>
    </form>
</div>
</body>
</html>
