<!doctype html>
<!-- Thymeleaf 템플릿 엔진을 사용함을 선언합니다. -->
<html lang="ko" xmlns:th="http://www.thymeleaf.org/">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Edit Board</title>
    <!-- Bootstrap CSS 파일을 링크합니다. th:href는 Thymeleaf가 동적으로 경로를 생성해줍니다. -->
    <link th:href="@{/css/bootstrap.min.css}" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
    <h2>Edit Board</h2>

    <!-- 컨트롤러에서 'error'라는 이름의 모델 속성이 전달된 경우에만 이 div를 표시합니다. (예: 비밀번호 불일치) -->
    <div th:if="${error}" class="alert alert-danger" role="alert">
        <!-- 에러 메시지를 출력합니다. -->
        <p th:text="${error}"></p>
    </div>


    <!-- 게시물 수정 폼입니다. -->
    <!-- th:action: 폼 제출 시 요청할 URL을 동적으로 생성합니다. {id} 부분은 ${board.id} 값으로 대체됩니다. -->
    <!-- th:object: 폼 데이터를 바인딩할 객체(board)를 지정합니다. -->
    <form th:action="@{/view/edit/{id}(id=${board.id})}" th:object="${board}" method="post">
        <!-- 수정할 게시물의 id를 숨겨진 필드로 전송합니다. th:field를 사용하면 id, name, value 속성이 자동으로 설정됩니다. -->
        <input type="hidden" th:field="*{id}">
        <div class="form-group">
            <label for="name">Name</label>
            <!-- th:field="*{name}"은 board.name 값을 입력 필드의 값으로 설정하고, 폼 제출 시 이 값을 다시 board 객체의 name 필드에 바인딩합니다. -->
            <input type="text" id="name" th:field="*{name}" class="form-control">
        </div>
        <div class="form-group">
            <label for="title">Title</label>
            <input type="text" id="title" th:field="*{title}" class="form-control">
        </div>
        <div class="form-group">
            <label for="content">Content</label>
            <input type="text" id="content" th:field="*{content}" class="form-control">
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <!-- 비밀번호는 보안상 th:field를 사용하지 않고, name 속성으로 직접 서버에 전달합니다. -->
            <input type="password" id="password" name="password" class="form-control" required>
        </div>
        <button type="submit" class="btn btn-success mt-3">게시물 수정</button>
    </form>
</div>
</body>
</html>
