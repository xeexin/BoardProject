<!doctype html>
<!-- Thymeleaf 템플릿 엔진을 사용함을 선언합니다. -->
<html lang="ko"  xmlns:th="http://www.thymeleaf.org/">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Detail</title>
    <!-- Bootstrap CSS 파일을 링크합니다. -->
    <link th:href="@{/css/bootstrap.min.css}" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
    <!-- th:text: 컨트롤러에서 전달된 board 객체의 title 속성값을 h2 태그의 텍스트로 설정합니다. -->
    <h2 th:text="${board.title}"></h2>
    <div>
        <!-- span 태그의 텍스트를 board 객체의 name 속성값으로 설정합니다. -->
        <p><strong>Name :</strong> <span th:text="${board.name}"></span></p>
        <p><strong>Content :</strong> <span th:text="${board.content}"></span></p>

        <p><strong>Created/Updated At :</strong>
            <!-- th:if: 조건에 따라 요소를 렌더링합니다. 수정일(updatedAt)이 생성일(createdAt)보다 나중인 경우 수정일을 표시합니다. -->
            <!-- #temporals.format: Thymeleaf의 유틸리티 객체를 사용하여 날짜/시간 객체의 형식을 지정합니다. -->
            <span th:if="${ board.updatedAt > board.createdAt}"
                  th:text="${#temporals.format(board.updatedAt, 'yyyy/MM/dd HH:mm')}"></span>
            <!-- 수정되지 않은 경우 생성일을 표시합니다. -->
            <span th:if="${board.updatedAt <= board.createdAt}"
                  th:text="${#temporals.format(board.createdAt, 'yyyy/MM/dd HH:mm')}"></span>
        </p>

        <div class="mt-3">
            <!-- 목록 페이지로 돌아가는 링크입니다. -->
            <a class="btn btn-primary" th:href="@{/view}">List</a>
            <!-- 수정 페이지로 이동하는 링크입니다. 현재 게시물의 id를 URL 경로에 포함시킵니다. -->
            <a class="btn btn-warning" th:href="@{/view/edit/{id}(id=${board.id})}">Edit</a>
            <!-- 삭제 확인 페이지로 이동하는 링크입니다. 현재 게시물의 id를 URL 경로에 포함시킵니다. -->
            <a class="btn btn-danger" th:href="@{/view/delete/{id}(id=${board.id})}">Delete</a>
        </div>
    </div>
</div>
</body>
</html>
